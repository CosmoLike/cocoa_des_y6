# Hybrid theory emulators on CPU; CosmoLike still projects the DES Y6 data vector.
# Networks are trained at mnu=0.06 eV. These examples use dummy likelihood data.
timing: true
debug: false
stop_at_error: true
likelihood:
  des_y6.combo_3x2pt:
    path: ./external_modules/data/des_y6
    data_file: DESY6.dataset
    print_datavector: true
    print_datavector_file: ./projects/des_y6/EXAMPLE_EMUL2_1.modelvector
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 50000
    kmax_boltzmann: 5.0
    non_linear_emul: 2
    IA_model: 0
    IA_code: 0
    IA_redshift_evolution: 3
    photoz_interpolation_type: 0
    photoz_zmid_convention: 0
    debug: false
    use_emulator: 2
params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.2
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.015
    proposal: 0.015
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 3
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.316
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  w0pwa:
    prior:
      min: -5
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
    derived: false
  mnu:
    value: 0.06
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
theory:
  emulrdrag:
    path: ./cobaya/cobaya/theories/
    provides:
    - rdrag
    extra_args:
      file:
      - external_modules/data/emultrf/BAO_SN_RES/emul_lcdm_rdrag_GP.joblib
      extra:
      - external_modules/data/emultrf/BAO_SN_RES/extra_lcdm_rdrag.npy
      ord:
      - - omegabh2
        - omegach2
  emulbaosn:
    path: ./cobaya/cobaya/theories/
    stop_at_error: true
    provides:
    - comoving_radial_distance
    - angular_diameter_distance
    - Hubble
    extra_args:
      device: cpu
      file:
      - None
      - external_modules/data/emultrf/BAO_SN_RES/w0wa/emul_w0wa_H.pt
      extra:
      - None
      - external_modules/data/emultrf/BAO_SN_RES/w0wa/extra_w0wa_H.npy
      ord:
      - None
      - - omegam
        - H0
        - w
        - wa
      extrapar:
      - MLA: INT
        ZMIN: 0.0001
        ZMAX: 3
        NZ: 600
      - MLA: ResMLP
        offset: 0.0
        INTDIM: 4
        NLAYER: 6
        TMAT: external_modules/data/emultrf/BAO_SN_RES/w0wa/PCA_w0wa_H.npy
        ZLIN: external_modules/data/emultrf/BAO_SN_RES/w0wa/z_lin_w0wa.npy
  emulmps:
    path: ./cobaya/cobaya/theories/
    stop_at_error: true
    extra_args:
      model_file: external_modules/data/emultrf/emulmps/npce_emul/emulator_npce.keras
      metadata_file: external_modules/data/emultrf/emulmps/npce_emul/metadata.joblib
      nl_model_file: external_modules/data/emultrf/emulmps/w0wa_halofit/emulator_halofit.keras
      nl_metadata_file: external_modules/data/emultrf/emulmps/w0wa_halofit/metadata.joblib
      use_syren: false
      param_order:
      - As_1e9
      - ns
      - H0
      - omegab
      - omegam
      - w
      - wa
sampler:
  evaluate:
    override:
      H0: 67.0
      omegam: 0.319
      omegab: 0.049
      As_1e9: 2.1
      ns: 0.96
      w: -1
      w0pwa: -1
      DES_DZ_S1: 0
      DES_DZ_S2: 0
      DES_DZ_S3: 0
      DES_DZ_S4: 0
      DES_DZ_L1: 0
      DES_DZ_L2: 0
      DES_DZ_L3: 0
      DES_DZ_L4: 0
      DES_DZ_L5: 0
      DES_DZ_L6: 0
      DES_M1: -0.00339767
      DES_M2: 0.0064552
      DES_M3: 0.01593935
      DES_M4: 0.00169811
      DES_A1_1: 0.7692307692307692
      DES_A1_2: -1.0
      DES_B1_1: 1.54
      DES_B1_2: 1.81
      DES_B1_3: 1.85
      DES_B1_4: 1.76
      DES_B1_5: 1.93
      DES_B1_6: 1.9
output: ./projects/des_y6/chains/EXAMPLE_EMUL2_EVALUATE1
